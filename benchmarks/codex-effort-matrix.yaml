version: 1

# Run only after the route screen. This matrix holds extraction at medium effort
# and varies Sol's open-ended tail effort, plus one low-effort Luna extraction
# probe. It prevents a route comparison from being confounded with reasoning effort.
pricing:
  version: llm-2026-07
  rates:
    codex/gpt-5.6-sol: {input_usd_per_million: 5, output_usd_per_million: 30, cached_input_usd_per_million: 0.5}
    codex/gpt-5.6-terra: {input_usd_per_million: 2.5, output_usd_per_million: 15, cached_input_usd_per_million: 0.25}

profiles:
  - id: luna_medium_sol_low_f3
    backend: codex
    max_agents_per_book: 3
    models: &luna_sol
      spelling_research: gpt-5.6-luna
      fact_pass: gpt-5.6-luna
      synthesizing: gpt-5.6-sol
      auditing: gpt-5.6-sol
      fixing: gpt-5.6-sol
    efforts:
      spelling_research: medium
      fact_pass: medium
      synthesizing: low
      auditing: low
      fixing: low
    judges: &judge
      - {backend: codex, model: gpt-5.6-sol, effort: high}

  - id: luna_medium_sol_medium_f3
    backend: codex
    max_agents_per_book: 3
    models: *luna_sol
    efforts: &medium
      spelling_research: medium
      fact_pass: medium
      synthesizing: medium
      auditing: medium
      fixing: medium
    judges: *judge

  - id: luna_medium_sol_high_f3
    backend: codex
    max_agents_per_book: 3
    models: *luna_sol
    efforts:
      spelling_research: medium
      fact_pass: medium
      synthesizing: high
      auditing: high
      fixing: high
    judges: *judge

  - id: luna_low_sol_medium_f3
    backend: codex
    max_agents_per_book: 3
    models: *luna_sol
    efforts:
      spelling_research: low
      fact_pass: low
      synthesizing: medium
      auditing: medium
      fixing: medium
    judges: *judge

  - id: terra_medium_sol_low_f3
    backend: codex
    max_agents_per_book: 3
    models: &terra_sol
      spelling_research: gpt-5.6-terra
      fact_pass: gpt-5.6-terra
      synthesizing: gpt-5.6-sol
      auditing: gpt-5.6-sol
      fixing: gpt-5.6-sol
    efforts:
      spelling_research: medium
      fact_pass: medium
      synthesizing: low
      auditing: low
      fixing: low
    judges: *judge

  - id: terra_medium_sol_medium_f3
    backend: codex
    max_agents_per_book: 3
    models: *terra_sol
    efforts: *medium
    judges: *judge

  - id: terra_medium_sol_high_f3
    backend: codex
    max_agents_per_book: 3
    models: *terra_sol
    efforts:
      spelling_research: medium
      fact_pass: medium
      synthesizing: high
      auditing: high
      fixing: high
    judges: *judge
